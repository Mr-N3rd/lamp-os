; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_cache_dir = ./.buildcache
data_dir = ./data
default_envs = upesy_wroom

[env:native]
platform = native
build_flags =
	-std=gnu++2a
	-std=c++2a
	-I src
build_unflags =
	-fno-rtti
	-std=gnu++11

[env:upesy_wroom]
board = upesy_wroom
lib_ldf_mode = chain
lib_compat_mode = strict
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
; Match the firmware's Serial.begin(115200) so `pio device monitor` (no flags)
; doesn't decode the lamp's logs as garbage.
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit NeoPixel@1.15.2
	bblanchon/ArduinoJson@7.4.2
	h2zero/NimBLE-Arduino@2.3.6
	knolleary/PubSubClient@2.8

build_flags =
	; optimize for performance
	-O2

	; source-rooted includes — write #include "config/config.hpp" instead of ../../config/config.hpp
	-I src

	; enable compiler warnings
	-Wall
	-Wextra

	; Increase radio power for bluetooth. should be modified in tandem with bluetooth.h constants
	-D MYNEWT_VAL_BLE_LL_TX_PWR_DBM=4

	; Per-characteristic ATT value cap. NimBLE-Arduino's default is 512
	; AND it clamps any per-char `max_len` argument against this value
	; inside the library's own .cpp (see NimBLEAttValue.cpp line 34:
	; `m_attr_max_len{std::min(BLE_ATT_ATTR_MAX_LEN, max_len)}`). So the
	; only way to raise the per-char cap is to recompile the LIBRARY
	; with this define in scope. build_flags here DOES reach lib compile,
	; BUT note the `build_cache_dir = ./.buildcache` at the top: when this
	; macro changes, you MUST `rm -rf .buildcache .pio/build` and rebuild
	; or the cached NimBLEAttValue.cpp.o will silently reuse the old cap.
	; A bare `pio run -t clean` does NOT clear .buildcache.
	;
	; The persisted-knockout base section can hit ~672 bytes on lamps with
	; a full knockout pattern; 1024 leaves ~50% headroom. RAM cost is
	; ~512 bytes per characteristic the value buffer for, allocated lazily
	; on setValue — negligible.
	;
	; STOPGAP: lamps with many expressions (>5) can also breach 1024 via
	; CHAR_EXPR_SECTION. The architectural fix is to paginate
	; expressions reads (per-index protocol + cursor). See user note from
	; 2026-06-11 — until then this cap is the operative ceiling for
	; expression count growth.
	-D BLE_ATT_ATTR_MAX_LEN=1024

	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1

	; Recommended build options from ESPAsyncWebServer
	-D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
	-D CONFIG_ASYNC_TCP_PRIORITY=10
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096

	; Allow debug serial logging throughout the app
	-D LAMP_DEBUG

	-D NDEBUG
	; 0=none 1=error 2=warn 3=info 4=debug 5=verbose
	-D CORE_DEBUG_LEVEL=2

	; Panic-handler, NimBLE host-task stack, and coredump settings are
	; now configured via `custom_sdkconfig` below (single source of truth
	; in the regenerated IDF sdkconfig.h, rather than -D build_flags that
	; collided with the regenerated sdkconfig.h when pioarduino is in
	; arduino-as-IDF-component mode).

	; (Arduino-ESP32 already wraps esp_panic_handler; we register via
	; set_arduino_panic_handler() in src/core/panic_handler.cpp instead.)

	; v0x03 mesh-deploy lock-in: disable SW coex.
	;
	; The cascade-reliability symptom (~22% delivery when the originator
	; lamp is BLE-connected to the Flutter app) matches Espressif IDF
	; issue #14904: SW coex starves ESP-NOW broadcasts when BLE adv
	; bursts contend for the same RF transient window. The fix on
	; chips without HW coex (ESP32-WROOM is one — the original ESP32
	; has only SW coex; HW coex is an ESP32-S3/C6 feature) is to
	; disable SW coex and accept the trade-off: ESP-NOW reliability
	; goes up, BLE connection stability may degrade slightly under
	; concurrent ESP-NOW load.
	;
	; CAVEAT — propagation is uncertain. pioarduino's Arduino-as-
	; component build ships with a PRECOMPILED libcoexist.a that has
	; CONFIG_ESP_COEX_SW_COEXIST_ENABLE=1 baked in (see
	; ~/.platformio/packages/framework-arduinoespressif32-libs/esp32/
	; dio_qspi/include/sdkconfig.h). A `-D` build flag here ONLY
	; affects our own source-file compilation, not the linked-in
	; library. Verification requires comparing cascade reliability on
	; hardware with the flag set vs. not. If the flag is a no-op on
	; this build setup, the fallback is to switch to a custom
	; sdkconfig.defaults (pioarduino docs) — or, as a last resort,
	; accept the SW-coex baseline and lean entirely on the Commit E
	; gossip-relay mechanism + the back-to-back broadcast pair to
	; compensate.
	;
	; The Commit E gossip-relay is the cascade-reliability primary
	; fix; this flag is the additional dial.
	;
	; Now configured via `custom_sdkconfig` below — the IDF lib rebuild
	; (libcoexist.a / libesp_wifi.a) actually picks up the change.
	; why: cascade reliability per validated plan §"Layer 0".

; Hybrid-compile: trigger pioarduino to rebuild the IDF static libs
; (libesp_system.a, libcoexist.a, libbt.a, libespcoredump.a, ...) with
; these overrides applied to its sdkconfig.defaults. Without this the
; precompiled libs ship with the upstream Espressif defaults baked in,
; and -D build_flags can only affect our own source-file compilation —
; not the linked-in archive.
;
; Picked up via platform-espressif32 55.03.39 (Jun 2026), which fixes
; upstream pioarduino issues #495 (--wrap=log_printf in HybridCompile)
; and #496 (outer SCons rerun on half-baked env) that previously
; blocked this flow on 55.03.30-2 (Aug 2025).
;
; Kconfig syntax: `=y`/`=n` for booleans, numeric values flow direct,
; and `# CONFIG_X is not set` is the Kconfig sentinel form required to
; disable some flags (the literal `=n` is not always accepted).
custom_sdkconfig =
	# IWDT widened to 1000ms for JIT-erase headroom (W25Q worst-case sector erase ~400ms)
	CONFIG_ESP_INT_WDT_TIMEOUT_MS=1000
	# Panic handler: print backtrace + reboot, no OCD wait
	CONFIG_ESP_SYSTEM_PANIC_PRINT_REBOOT=y
	# CONFIG_ESP_DEBUG_OCDAWARE is not set
	# Coredump to flash partition, ELF format, CRC32 checksum
	CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y
	CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=y
	CONFIG_ESP_COREDUMP_CHECKSUM_CRC32=y
	# NimBLE host task stack 8KB (default 4KB)
	CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192
	# NOTE: SW coexistence stays ENABLED (the IDF default). Prior comment
	# block contemplated disabling it for ESP-NOW reliability under BLE
	# load — but on the original ESP32 (ESP32-WROOM, no HW coex), the
	# precompiled-lib build silently ignored a -D override. When the
	# 55.03.39 HybridCompile actually picked up the disable, the BLE
	# controller failed to init (esp_bt_controller_init err=259, then
	# LoadProhibited in ble_hs_lock when NimBLE tried to create the
	# server). Cascade reliability is handled via the Commit E
	# gossip-relay instead; the SW-coex knob stays on.

; The Insights / RainMaker / Diagnostics components ship via the
; pioarduino bundled-lib path and previously leaked into the source
; build (cert-embed bug + redef cascade in HybridCompile mode). The
; project doesn't use any of them; strip them out so component-manager
; doesn't pull them in.
custom_component_remove =
	espressif/esp_insights
	espressif/esp_diagnostics
	espressif/esp_diag_data_store
	espressif/esp_rainmaker
	espressif/rmaker_common

; custom partitions for lamps to support ota
board_build.partitions = ./partitions.csv
board_build.filesystem = spiffs
monitor_filters = esp32_exception_decoder

; Post-build: append the LSIG footer (ed25519-signed) so the wisp embed
; step has a verifiable firmware.bin to carry. See scripts/sign_firmware.py
; + scripts/README.md for the full OTA pipeline.
extra_scripts = post:../../scripts/sign_firmware.py

[env:test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = upesy_wroom
test_framework = unity
test_build_src = no
test_filter = test_color_only
build_flags =
	-D UNIT_TEST
	-D CORE_DEBUG_LEVEL=0
	-std=c++17
	-I src
