<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamplit</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    background: #0d0d0d;
    color: #fdfdfd;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
    background: radial-gradient(circle at 50% 30%, #1E1B4B 0%, #000 60%);
  }
  .logo {
    width: 96px;
    height: auto;
    margin-bottom: 32px;
    opacity: 0.95;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }
  p {
    color: #cccccc;
    max-width: 360px;
    margin-bottom: 16px;
  }
  .url {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 18px;
    border: 1px solid rgba(253, 253, 253, 0.08);
    border-radius: 8px;
    background: #1a1a1a;
    color: #8dcda6;
    font-family: "JetBrains Mono", "Courier New", ui-monospace, monospace;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .footer {
    margin-top: 40px;
    font-size: 0.85rem;
    color: rgba(253, 253, 253, 0.4);
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.svg" alt="Lamplit logo">
  <h1>Welcome to your lamp</h1>
  <p>To configure your lamp, please open Safari, Chrome, or another browser and visit:</p>
  <span class="url">192.168.4.1</span>
  <div class="footer">Lamplit</div>
</main>
</body>
</html>
