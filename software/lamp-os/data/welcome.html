<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamplit</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    background: #0d0d0d;
    color: #fdfdfd;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
    background: radial-gradient(circle at 50% 30%, #1E1B4B 0%, #000 60%);
  }
  .logo {
    width: 96px;
    height: auto;
    margin-bottom: 32px;
    opacity: 0.95;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }
  p {
    color: #cccccc;
    max-width: 360px;
    margin-bottom: 16px;
  }
  .button {
    display: inline-block;
    margin-top: 12px;
    padding: 14px 28px;
    border: 1px solid rgba(141, 205, 166, 0.4);
    border-radius: 8px;
    background: #8dcda6;
    color: #0d0d0d;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .button:active {
    background: #7bbf94;
  }
  .fallback {
    margin-top: 20px;
    font-size: 0.85rem;
    color: rgba(253, 253, 253, 0.5);
  }
  .fallback code {
    color: #8dcda6;
    font-family: "JetBrains Mono", "Courier New", ui-monospace, monospace;
  }
  .footer {
    margin-top: 40px;
    font-size: 0.85rem;
    color: rgba(253, 253, 253, 0.4);
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.svg" alt="Lamplit logo">
  <h1>Welcome to your lamp</h1>
  <p>Tap the button below to open the configurator.</p>
  <a id="setupLink" class="button" href="http://192.168.4.1/">Open Lamp Setup</a>
  <p class="fallback">If the button doesn't work, open Safari, Chrome, or another browser and visit <code>192.168.4.1</code>.</p>
  <div class="footer">Lamplit</div>
</main>
<script>
  if (/Android/i.test(navigator.userAgent)) {
    document.getElementById('setupLink').href =
      'intent://192.168.4.1/#Intent;scheme=http;end';
  }
</script>
</body>
</html>
