; PioArduino Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
build_cache_dir = ./.buildcache
data_dir = ./data
default_envs = seeed_xiao_esp32_c6

[env:seeed_xiao_esp32_c6]
lib_ldf_mode = chain
lib_compat_mode = strict
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c6
lib_deps =
	h2zero/NimBLE-Arduino@2.3.6
	nanopb/Nanopb @ ^0.4.8
	gilmaimon/ArduinoWebsockets @ ^0.5.4
	bblanchon/ArduinoJson @ ^7.0.4

build_flags =
	; optimize for performance
	-O2

	; enable compiler warnings
	-Wall
	-Wextra

	; Arduino debugging options
	-D NDEBUG
	-D CORE_DEBUG_LEVEL=5

	; Aurora vendored sources live under src/aurora/. The reference uses bare
	; "PaletteList.h"-style includes, so the include path mirrors the reference's
	; layout one level deeper.
	-I src
	-I src/aurora
	-I src/aurora/proto
	-I lib/miniz
	-D PB_FIELD_32BIT=1

;Over the air partition is disabled
board_build.partitions = no_ota.csv

; Host-side unit tests (pure-logic only): palette JSON parse + notification
; codec roundtrip. Arduino-coupled glue (MeshLink, LampInventory, main, and the
; Aurora networking files) is excluded from the source filter.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
	+<*>
	-<main.cpp>
	-<MeshLink.cpp>
	-<LampInventory.cpp>
	-<CurrentPalette.cpp>
	-<PaintDistributor.cpp>
	-<StatusBeacon.cpp>
	-<TupleSampler.cpp>
	-<aurora/AuroraDiscovery.cpp>
	-<aurora/AuroraWsConnection.cpp>
	-<aurora/PaletteFetcher.cpp>
	-<aurora/AuroraPaletteClient.cpp>
lib_deps =
	nanopb/Nanopb @ ^0.4.8
	bblanchon/ArduinoJson @ ^7.0.4
build_flags =
	-I src
	-I src/aurora
	-I src/aurora/proto
	-I lib/miniz
	-D PB_FIELD_32BIT=1
	-std=gnu++17
