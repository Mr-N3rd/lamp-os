name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets:
      LAMP_FIRMWARE_PRIVATE_KEY_HEX: ${{ secrets.LAMP_FIRMWARE_PRIVATE_KEY_HEX }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
      - uses: actions/download-artifact@v4
        with:
          name: updates
          path: updates
      - uses: actions/download-artifact@v4
        with:
          name: lamp-firmware-signed
          path: signed/lamp
      - name: Rename signed artifact for clarity in the release
        run: |
          mv signed/lamp/firmware-signed.bin signed/lamp-firmware-signed.bin
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: legacy
          files: |
            distribution.bin
            updates/bootloader.bin
            updates/partitions.bin
            updates/firmware.bin
            updates/spiffs.bin
            signed/lamp-firmware-signed.bin
