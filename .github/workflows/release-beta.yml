name: Release (beta)

on:
  push:
    branches:
      - beta

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets:
      LAMP_FIRMWARE_PRIVATE_KEY_HEX: ${{ secrets.LAMP_FIRMWARE_PRIVATE_KEY_HEX }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
      - uses: actions/download-artifact@v4
        with:
          name: updates
          path: updates
      - uses: actions/download-artifact@v4
        with:
          name: lamp-firmware-signed
          path: signed/lamp
      - name: Rename signed artifact for clarity in the release
        run: |
          mv signed/lamp/firmware-signed.bin signed/lamp-firmware-signed.bin
      - name: Replace rolling beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete beta --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta build
          prerelease: true
          body: |
            Rolling beta build from `beta` branch (commit ${{ github.sha }}).

            Unstable, untested — use at your own risk.
          files: |
            distribution.bin
            updates/bootloader.bin
            updates/partitions.bin
            updates/firmware.bin
            updates/spiffs.bin
            signed/lamp-firmware-signed.bin
