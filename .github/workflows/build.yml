# workflows adapted from the WLED project using PlatformIO
name: LampOS Build

# Only included into other workflows
on:
  workflow_call:

permissions:
  contents: read

jobs:

  ui_build:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./software/lamp-ui/package-lock.json
    - name: Install UI dependencies
      working-directory: ./software/lamp-ui
      run: npm ci
    - name: Lint UI
      working-directory: ./software/lamp-ui
      run: npm run lint
    - name: Test UI
      working-directory: ./software/lamp-ui
      run: npm run test:unit -- --run
    - name: Build UI
      working-directory: ./software/lamp-ui
      run: npm run build
    - uses: actions/upload-artifact@v4
      with:
        name: ui-dist
        path: ./software/lamp-ui/dist

  build:
    name: Build Environment
    runs-on: ubuntu-latest
    needs: ui_build
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: ui-dist
        path: ./software/lamp-ui/dist
    - name: Sync UI filesystem assets
      run: |
        mkdir -p ./software/lamp-os/data
        rsync -a --delete ./software/lamp-ui/dist/ ./software/lamp-os/data/
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
          python-version: '3.12'
          cache: 'pip'
    - name: Install PlatformIO
      run: pip install -r requirements.txt
    - name: Build firmware
      working-directory: ./software/lamp-os
      run: |
        pio run --environment upesy_wroom
        pio run --target buildfs --environment upesy_wroom
    - name: Merge firmware
      working-directory: ./software/lamp-os/.pio/build/upesy_wroom
      run: |
        esptool --chip esp32 merge-bin -o distribution.bin --flash-mode dio --flash-freq 40m --flash-size 4MB 0x1000 bootloader.bin 0x8000 partitions.bin 0x10000 firmware.bin 0x3D0000 spiffs.bin
    - uses: actions/upload-artifact@v4
      with:
        name: distribution
        path: |
          ./software/lamp-os/.pio/build/upesy_wroom/distribution.bin
    - uses: actions/upload-artifact@v4
      with:
        name: updates
        path: |
          ./software/lamp-os/.pio/build/upesy_wroom/bootloader.bin
          ./software/lamp-os/.pio/build/upesy_wroom/partitions.bin
          ./software/lamp-os/.pio/build/upesy_wroom/firmware.bin
          ./software/lamp-os/.pio/build/upesy_wroom/spiffs.bin
